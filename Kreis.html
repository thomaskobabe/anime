<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Anime.js Animation</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f0f0f0;
    }
    svg {
      width: 200px;
      height: 200px;
    }
  </style>
</head>
<body>

  <!-- SVG-KREIS -->
  <svg id="mySvg" viewBox="0 0 100 100">
    <circle id="myCircle" cx="50" cy="50" r="40" stroke="blue" stroke-width="2" fill="none" />
  </svg>

  <!-- anime.js-Bibliothek einbinden -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

  <!-- Animations-Script -->
  <script>
    anime({
      targets: '#myCircle',
      strokeDashoffset: [anime.setDashoffset, 0],
      scale: [0.5, 1],
      opacity: [0, 1],
      easing: 'easeInOutSine',
      duration: 2000,
      delay: 500
    });
  </script>

</body>
</html>
